<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-light-64.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark-64.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon-light-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- #321: iOS reads this only when the icon is added to the Home Screen.
         `default` starts the web view below the status bar, so Liquid Glass
         does not frost the title. `black-translucent` (and a missing value
         on some iOS 26/27 installs) paints that frost over the header.
         An already-installed icon keeps the old style until it is removed
         and added again. The head script below pads that install. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="My Money" />
    <meta
      name="theme-color"
      content="#f8faf8"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1b2a41"
      media="(prefers-color-scheme: dark)"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <script>
      ;(() => {
        try {
          const raw = localStorage.getItem('my-money-theme')
          const ALLOWED = ['fresh', 'ledger', 'green', 'soft', 'neutral', 'pastel']
          const mood = raw ? JSON.parse(raw)?.state?.mood : 'fresh'
          document.documentElement.dataset.mood = ALLOWED.includes(mood)
            ? mood
            : 'fresh'
        } catch {
          document.documentElement.dataset.mood = 'fresh'
        }
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark')
        }
      })()
      // #321: keep the title below the iOS home-screen frost on icons
      // added before the status-bar meta above. Numbers match
      // iosStatusBarOverlay.ts (120 clear, 44 below-status-bar cutoff).
      ;(() => {
        if (navigator.standalone !== true) return
        if (window.matchMedia('(orientation: landscape)').matches) return
        if (screen.height - window.innerHeight >= 44) return
        const probe = document.createElement('div')
        probe.style.paddingTop = 'env(safe-area-inset-top)'
        document.documentElement.appendChild(probe)
        const inset = Number.parseFloat(getComputedStyle(probe).paddingTop) || 0
        probe.remove()
        const extra = 120 - (Math.max(0, inset) + 12)
        if (extra > 0) {
          document.documentElement.style.setProperty(
            '--ios-status-overlay-pad',
            `${extra}px`,
          )
        }
      })()
    </script>
    <title>My Money</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
